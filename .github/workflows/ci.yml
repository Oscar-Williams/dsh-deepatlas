name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build

  # ① 分发完整性:src 与提交的 lib/ 必须一致(lib/ 事故的"永不回归"闸门)
  # lib/ 是随仓库分发的构建产物(github: 安装无构建步骤),过期即发布级缺陷。
  distribution-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: lib/ 产物不得与 src/ 漂移
        run: |
          if ! git diff --exit-code -- lib/; then
            echo "::error::Generated distribution files are stale(提交的 lib/ 与 src/ 不一致)。Run npm run build and commit lib/."
            exit 1
          fi

  # ② 分发 E2E:测试对象必须是 Git 能交付的内容,安装语义必须与用户一致
  # (tarball;目录 link: 不装 dependencies,语义不等价——2026-08-23 实测)
  distribution-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 dsh 与 pnpm
        run: npm i -g pnpm @deepseek-ai/dsh --no-fund --no-audit
      - name: 分发验证(archive→pack→安装→组合→启动)
        run: bash scripts/verify-distribution.sh
